<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>人生智能编排体 (Android App)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: rgba(18, 22, 28, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent-green: #00F5A0;
        }
        body {
            background-color: var(--bg-main);
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            border-radius: 1rem;
        }
        .btn-neon {
            background: linear-gradient(135deg, #00F5A0, #00D284);
            color: #000000;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 245, 160, 0.3);
        }
        .btn-neon:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }
        .tab-active {
            color: #00F5A0 !important;
        }
        /* 隐藏原生滚动条 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col pb-20">

    <!-- 顶部原生 App Header -->
    <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-xl border-b border-white/10 px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-[#00F5A0] text-black font-black flex items-center justify-center text-sm">Ω</div>
            <div>
                <div class="font-bold text-sm tracking-wide">人生智能编排体</div>
                <div class="text-[10px] text-slate-400 font-mono">Android Native Edition</div>
            </div>
        </div>
        <button onclick="openServerConfigModal()" class="text-xs px-2.5 py-1 rounded-full bg-white/10 text-slate-300 font-mono">
            ⚙️ <span id="server-status-pill">本地离线</span>
        </button>
    </header>

    <!-- 主体容器 (Tab 页面切换) -->
    <main class="flex-1 px-4 py-4 space-y-4 max-w-md mx-auto w-full">

        <!-- TAB 1: 首页总览 -->
        <div id="tab-home" class="tab-pane space-y-4">
            <!-- 今日打卡卡片 -->
            <div class="glass-card p-4 flex items-center justify-between">
                <div>
                    <span class="text-[11px] text-emerald-400 font-mono">每日精进 · 连续记录</span>
                    <h2 class="text-lg font-black text-white mt-0.5"><span id="streak-days">1</span> 天连击 🔥</h2>
                </div>
                <button onclick="triggerDailyPlan()" class="btn-neon px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5">
                    <span>✨ AI一键规划</span>
                </button>
            </div>

            <!-- AI 每日寄语 -->
            <div id="ai-banner" class="hidden glass-card p-3.5 border-emerald-500/30 text-xs text-slate-200 space-y-1">
                <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
                    <span>⚡ AI 今日作战提醒：</span>
                </div>
                <div id="ai-banner-text" class="leading-relaxed"></div>
            </div>

            <!-- 今日焦点任务清单 -->
            <div class="glass-card p-4 space-y-3">
                <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
                    <div class="text-sm font-bold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-[#00F5A0]"></span>
                        <span>今日待办任务</span>
                    </div>
                    <span id="task-ratio" class="text-[11px] font-mono text-emerald-400">0/0</span>
                </div>
                <div id="home-tasks-list" class="space-y-2">
                    <div class="py-4 text-center text-xs text-slate-500">今日暂无任务，可点击上方「AI一键规划」。</div>
                </div>
            </div>

            <!-- 目标推进卡片 -->
            <div class="glass-card p-4 space-y-3">
                <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
                    <div class="text-sm font-bold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-[#38BDF8]"></span>
                        <span>重点目标推进</span>
                    </div>
                    <button onclick="switchTab('goals')" class="text-xs text-slate-400">查看全部 →</button>
                </div>
                <div id="home-goals-list" class="space-y-2.5">
                    <div class="py-4 text-center text-xs text-slate-500">暂无目标</div>
                </div>
            </div>
        </div>

        <!-- TAB 2: 目标树系统 -->
        <div id="tab-goals" class="tab-pane hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-white">目标分层体系</h2>
                <button onclick="openNewGoalModal()" class="btn-neon px-3 py-1.5 rounded-lg text-xs font-semibold">+ 新建目标</button>
            </div>
            <div id="goals-list-container" class="space-y-3">
                <div class="py-6 text-center text-xs text-slate-500">正在获取目标列表...</div>
            </div>
        </div>

        <!-- TAB 3: 今日生活记录 -->
        <div id="tab-log" class="tab-pane hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-white">3分钟极简记录</h2>
                <button onclick="submitLogForm()" class="btn-neon px-4 py-1.5 rounded-lg text-xs font-bold">保存流水</button>
            </div>

            <div class="glass-card p-4 space-y-3">
                <label class="block text-xs font-medium text-emerald-400">今日做成了什么 (Done)</label>
                <textarea id="log-app-done" rows="3" class="w-full p-2.5 bg-black/60 border border-white/10 rounded-lg text-xs" placeholder="写下今天完成的实质交付与动作..."></textarea>
            </div>

            <div class="glass-card p-4 space-y-2">
                <div class="flex justify-between text-xs text-slate-300">
                    <span class="text-[#38BDF8] font-bold">学习时长</span>
                    <input type="number" id="log-app-study" class="w-16 px-2 py-1 bg-black/60 border border-white/10 rounded text-center text-xs font-mono" placeholder="min" value="0">
                </div>
                <input type="text" id="log-app-study-note" class="w-full p-2 bg-black/60 border border-white/10 rounded-lg text-xs" placeholder="学习内容备注...">
            </div>

            <div class="glass-card p-4 space-y-3">
                <label class="block text-xs font-medium text-amber-400">今日饮食速记</label>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <input type="text" id="log-app-bf" class="p-2 bg-black/60 border border-white/10 rounded" placeholder="早餐">
                    <input type="text" id="log-app-lu" class="p-2 bg-black/60 border border-white/10 rounded" placeholder="午餐">
                    <input type="text" id="log-app-di" class="p-2 bg-black/60 border border-white/10 rounded" placeholder="晚餐">
                    <input type="text" id="log-app-sn" class="p-2 bg-black/60 border border-white/10 rounded" placeholder="加餐/咖啡">
                </div>
            </div>

            <div class="glass-card p-4 space-y-3">
                <div class="flex justify-between text-xs">
                    <span class="text-indigo-400 font-bold">昨晚睡眠</span>
                    <div class="flex items-center gap-1 font-mono text-xs">
                        <input type="text" id="log-app-sleep-s" class="w-16 p-1 bg-black/60 border border-white/10 rounded text-center" placeholder="23:30">
                        <span>~</span>
                        <input type="text" id="log-app-sleep-e" class="w-16 p-1 bg-black/60 border border-white/10 rounded text-center" placeholder="07:30">
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 4: AI 决策顾问 -->
        <div id="tab-advisor" class="tab-pane hidden space-y-4">
            <div class="glass-card p-4 space-y-3 border-emerald-500/30">
                <div class="flex items-center gap-2 text-xs font-bold text-emerald-400">
                    <span class="w-2 h-2 rounded-full bg-[#00F5A0] animate-pulse"></span>
                    <span>AI 决策顾问 (6段式结构推演)</span>
                </div>
                <textarea id="advisor-app-q" rows="3" class="w-full p-3 bg-black/60 border border-white/10 rounded-xl text-xs leading-relaxed" placeholder="问任何生活决定：&#10;“今晚能熬夜看球赛吗？”&#10;“我能吃火锅吗？”&#10;“想辞职做自媒体值得吗？”"></textarea>
                <button onclick="submitAdvisorQ()" class="btn-neon w-full py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                    <span>开始智能研判</span>
                </button>
            </div>

            <!-- 研判输出区 -->
            <div id="advisor-result-card" class="hidden glass-card p-4 space-y-3 border-emerald-500/40">
                <div class="flex items-center justify-between border-b border-white/10 pb-2">
                    <span class="text-xs text-slate-400">研判结论</span>
                    <span id="adv-res-c" class="text-xs font-black px-2.5 py-0.5 rounded-full font-mono bg-emerald-950 text-[#00F5A0] border border-[#00F5A0]/40">--</span>
                </div>
                <div class="space-y-1">
                    <div class="text-[11px] font-bold text-slate-400">理由与依据</div>
                    <div id="adv-res-r" class="text-xs text-slate-200 bg-white/5 p-2.5 rounded-lg leading-relaxed"></div>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="p-2.5 rounded-lg bg-emerald-950/30 border border-emerald-500/20 text-emerald-200" id="adv-res-p"></div>
                    <div class="p-2.5 rounded-lg bg-red-950/30 border border-red-500/20 text-red-200" id="adv-res-cons"></div>
                </div>
                <div class="space-y-1">
                    <div class="text-[11px] font-bold text-amber-400">最佳折中策略</div>
                    <div id="adv-res-alt" class="text-xs text-amber-100 bg-amber-950/20 p-2.5 rounded-lg leading-relaxed"></div>
                </div>
                <div class="space-y-1">
                    <div class="text-[11px] font-bold text-[#38BDF8]">与目标关系</div>
                    <div id="adv-res-g" class="text-xs text-blue-100 bg-blue-950/20 p-2.5 rounded-lg leading-relaxed"></div>
                </div>
            </div>
        </div>

        <!-- TAB 5: 复盘雷达与档案 -->
        <div id="tab-profile" class="tab-pane hidden space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-white">缺口雷达与档案</h2>
                <button onclick="requestAppReview('weekly')" class="btn-neon px-3 py-1.5 rounded-lg text-xs font-semibold">生成周复盘</button>
            </div>

            <!-- 缺口雷达容器 -->
            <div id="gaps-list-app" class="space-y-2">
                <div class="py-4 text-center text-xs text-slate-500">正在探测缺口...</div>
            </div>

            <!-- 个人愿景卡片 -->
            <div class="glass-card p-4 space-y-2">
                <div class="text-xs font-bold text-slate-300">人生愿景</div>
                <p id="app-profile-vision" class="text-xs text-slate-400 italic">“保持强健体魄与顶尖实践者姿态”</p>
            </div>
        </div>

    </main>

    <!-- 底部原生 App TabBar (移动端核心操控区) -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/95 backdrop-blur-2xl border-t border-white/10 px-2 py-1 max-w-md mx-auto">
        <div class="grid grid-cols-5 text-center">
            <button onclick="switchTab('home')" class="tab-btn flex flex-col items-center py-1 text-slate-400 tab-active" data-tab="home">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span class="text-[10px] mt-0.5">总览</span>
            </button>
            <button onclick="switchTab('goals')" class="tab-btn flex flex-col items-center py-1 text-slate-400" data-tab="goals">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span class="text-[10px] mt-0.5">目标</span>
            </button>
            <button onclick="switchTab('log')" class="tab-btn flex flex-col items-center py-1 text-slate-400" data-tab="log">
                <div class="w-7 h-7 -mt-2 rounded-full bg-[#00F5A0] text-black flex items-center justify-center font-bold text-sm shadow-[0_0_10px_rgba(0,245,160,0.5)]">+</div>
                <span class="text-[10px] mt-0.5">记录</span>
            </button>
            <button onclick="switchTab('advisor')" class="tab-btn flex flex-col items-center py-1 text-slate-400" data-tab="advisor">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                <span class="text-[10px] mt-0.5">AI顾问</span>
            </button>
            <button onclick="switchTab('profile')" class="tab-btn flex flex-col items-center py-1 text-slate-400" data-tab="profile">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span class="text-[10px] mt-0.5">复盘档案</span>
            </button>
        </div>
    </nav>

    <!-- 服务连接配置模态框 -->
    <div id="server-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="glass-card w-full max-w-xs p-5 space-y-3 border-emerald-500/40">
            <h3 class="text-sm font-bold text-white">服务端连接配置</h3>
            <p class="text-[11px] text-slate-400">输入局域网后端服务地址，与 AI 智能体编排服务实时联通：</p>
            <input type="text" id="api-base-input" class="w-full p-2 bg-black/60 border border-white/10 rounded text-xs font-mono" placeholder="http://192.168.1.5:8000">
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeServerConfigModal()" class="px-3 py-1.5 rounded text-xs text-slate-400">取消</button>
                <button onclick="saveServerConfig()" class="btn-neon px-3.5 py-1.5 rounded text-xs font-semibold">保存连接</button>
            </div>
        </div>
    </div>

    <script>
        // 核心客户端通信与桥接
        let API_BASE = localStorage.getItem('LP_API_BASE') || '';

        function triggerHaptic() {
            if (window.AndroidNative && window.AndroidNative.hapticFeedback) {
                window.AndroidNative.hapticFeedback(25);
            }
        }

        function showAppToast(msg) {
            if (window.AndroidNative && window.AndroidNative.showToast) {
                window.AndroidNative.showToast(msg);
            } else {
                alert(msg);
            }
        }

        function switchTab(tabId) {
            triggerHaptic();
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('tab-active');
                } else {
                    btn.classList.remove('tab-active');
                }
            });

            if (tabId === 'goals') loadGoalsData();
            if (tabId === 'profile') loadProfileAndGaps();
        }

        async function appFetch(endpoint, options = {}) {
            const url = API_BASE ? `${API_BASE}${endpoint}` : endpoint;
            options.headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            try {
                const res = await fetch(url, options);
                return await res.json();
            } catch (e) {
                console.warn('API离线或降级中:', e);
                return null;
            }
        }

        async function initApp() {
            if (API_BASE) {
                document.getElementById('server-status-pill').innerText = '已联网';
            }
            loadHomeTasks();
        }

        async function loadHomeTasks() {
            const tasks = await appFetch('/api/tasks');
            const container = document.getElementById('home-tasks-list');
            if (tasks && tasks.length > 0) {
                const done = tasks.filter(t => t.done).length;
                document.getElementById('task-ratio').innerText = `${done}/${tasks.length}`;
                container.innerHTML = tasks.map(t => `
                    <div class="flex items-center justify-between p-2.5 rounded-lg bg-white/5 text-xs">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTaskDone(${t.id}, this.checked)" class="w-4 h-4 rounded accent-[#00F5A0]">
                            <span class="${t.done ? 'line-through text-slate-500' : 'text-slate-100'}">${t.title}</span>
                        </div>
                        <span class="font-mono text-[10px] text-slate-400">${t.est_minutes}m</span>
                    </div>
                `).join('');
            }
        }

        async function toggleTaskDone(id, done) {
            triggerHaptic();
            await appFetch(`/api/tasks/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ done: done })
            });
            loadHomeTasks();
        }

        async function triggerDailyPlan() {
            triggerHaptic();
            showAppToast('AI 正在编排今日日程...');
            const res = await appFetch('/api/ai/daily-plan', { method: 'POST' });
            if (res && res.tip) {
                document.getElementById('ai-banner').classList.remove('hidden');
                document.getElementById('ai-banner-text').innerText = res.tip;
            }
            loadHomeTasks();
        }

        async function submitAdvisorQ() {
            const q = document.getElementById('advisor-app-q').value.trim();
            if (!q) return showAppToast('请输入咨询问题');
            triggerHaptic();
            showAppToast('AI 正在深度研判中...');

            const data = await appFetch('/api/ai/ask', {
                method: 'POST',
                body: JSON.stringify({ question: q })
            });

            if (data) {
                document.getElementById('advisor-result-card').classList.remove('hidden');
                document.getElementById('adv-res-c').innerText = data.conclusion || '建议做';
                document.getElementById('adv-res-r').innerText = data.reason || '无';
                document.getElementById('adv-res-p').innerText = '好处: ' + (data.pros || '无');
                document.getElementById('adv-res-cons').innerText = '风险: ' + (data.cons_risks || '无');
                document.getElementById('adv-res-alt').innerText = data.alternative || '无';
                document.getElementById('adv-res-g').innerText = data.goal_relation || '无';
            }
        }

        function openServerConfigModal() {
            document.getElementById('api-base-input').value = API_BASE;
            document.getElementById('server-modal').classList.remove('hidden');
            document.getElementById('server-modal').classList.add('flex');
        }

        function closeServerConfigModal() {
            document.getElementById('server-modal').classList.add('hidden');
            document.getElementById('server-modal').classList.remove('flex');
        }

        function saveServerConfig() {
            API_BASE = document.getElementById('api-base-input').value.trim();
            localStorage.setItem('LP_API_BASE', API_BASE);
            document.getElementById('server-status-pill').innerText = API_BASE ? '已连接' : '本地离线';
            closeServerConfigModal();
            showAppToast('配置已更新');
            initApp();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
