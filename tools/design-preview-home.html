<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{--bg:#121110;--surface:#1B1917;--hi:#24211E;--var:#2C2824;--border:rgba(255,255,255,.12);
--accent:#D98E63;--accent2:#C4764B;--sage:#8FAE8B;--pos:#9DBF9E;--warn:#D9A441;--info:#8FA8B8;
--t1:#F3EDE4;--t2:#C9C0B4;--t3:#948B80}
body{width:390px;height:844px;background:linear-gradient(180deg,#141210,#121110);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--t1);overflow:hidden}
.screen{height:100%;overflow:hidden;padding:22px 20px 0}
.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.date{font-size:11px;letter-spacing:.4px;color:var(--t3)}
.h1{font-size:27px;font-weight:600;letter-spacing:-.2px;margin-top:5px}
.actions{display:flex;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:16px}
.card{border-radius:16px;background:var(--surface);border:1px solid var(--border);padding:16px;margin-bottom:12px}
.card.tap{display:flex;flex-direction:column}
.ct{font-size:15.5px;font-weight:500}
.cs{font-size:12.5px;line-height:1.55;color:var(--t2);margin-top:6px}
.cta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--accent);font-size:15px;font-weight:500}
.askbar{border-radius:14px;background:var(--surface);border:1px solid var(--border);padding:12px 10px 12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.askbar .tx{flex:1}
.askbar .p{font-size:15px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.askbar .h{font-size:11px;color:var(--t3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{width:34px;height:34px;border-radius:17px;background:rgba(217,142,99,.14);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px}
.stats{display:flex;align-items:center;padding:2px 0 18px}
.stat{flex:1}
.stat .num{font-size:18px;font-weight:600}
.stat .num span{font-size:11px;color:var(--t3);font-weight:400;margin-left:3px}
.stat .lab{font-size:11px;color:var(--t3);margin-top:3px}
.vd{width:1px;height:26px;background:var(--border);margin:0 8px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sech{font-size:18px;font-weight:600}
.secm{font-size:11.5px;color:var(--t3)}
.tasks{border-radius:16px;background:var(--surface);border:1px solid var(--border);padding:8px 16px;margin-bottom:16px}
.task{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.task:last-child{border-bottom:0}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(255,255,255,.22);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#121110}
.cb.on{background:var(--accent);border-color:transparent;font-weight:800}
.tk{flex:1}
.tk .tt{font-size:14px;line-height:1.35}
.tk .tt.done{color:var(--t3);text-decoration:line-through}
.tk .tm{font-size:10.5px;color:var(--t3);margin-top:3px}
.pill{font-size:10px;color:var(--pos);background:rgba(157,191,158,.12);padding:2px 7px;border-radius:6px}
.nav{position:absolute;left:0;right:0;bottom:0;background:var(--hi);border-top:1px solid var(--border);padding-bottom:18px}
.nav .row{display:flex;height:58px;align-items:center}
.nav .it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--t3);font-size:11px}
.nav .it .i{font-size:18px}
.nav .it.sel{color:var(--accent)}
</style></head><body>
<div class="screen">
  <div class="head">
    <div><div class="date">10 月 17 日 · 周五</div><div class="h1">晚上好</div></div>
    <div class="actions"><div class="iconbtn">◍</div><div class="iconbtn">⚙</div></div>
  </div>
  <div class="card tap">
    <div class="ct">先认识一下你</div>
    <div class="cs">AI 会问你年龄、工作、收入、现在的生活和想成为的样子，最后整理成档案与目标。</div>
    <div class="cta"><span>开始访谈</span><span>→</span></div>
  </div>
  <div class="askbar"><div class="tx"><div class="p">记一句今天，或说说接下来想做什么…</div><div class="h">整理成记录、任务或目标，确认后才保存</div></div><div class="plus">＋</div></div>
  <div class="stats">
    <div class="stat"><div class="num">12<span>天</span></div><div class="lab">连续记录</div></div><div class="vd"></div>
    <div class="stat"><div class="num">78<span>%</span></div><div class="lab">完成率</div></div><div class="vd"></div>
    <div class="stat"><div class="num">3<span>项</span></div><div class="lab">今日任务</div></div>
  </div>
  <div class="sec"><div class="sech">今日任务</div><div class="secm">1 / 3 完成</div></div>
  <div class="tasks">
    <div class="task"><div class="cb on">✓</div><div class="tk"><div class="tt done">晨间英语听力 25 分钟</div><div class="tm">预计 25 分钟 · 英语提升</div></div><div class="pill">已完成</div></div>
    <div class="task"><div class="cb"></div><div class="tk"><div class="tt">论文初稿：完成方法章节</div><div class="tm">预计 90 分钟 · 毕业论文</div></div></div>
    <div class="task"><div class="cb"></div><div class="tk"><div class="tt">晚间跑步 3 公里</div><div class="tm">预计 30 分钟 · 健康计划</div></div></div>
  </div>
  <div class="sec"><div class="sech">今日一句</div></div>
  <div class="card"><div style="font-size:15px;line-height:1.55">星光不问赶路人，时光不负有心人。</div><div style="font-size:11px;color:var(--t3);margin-top:6px">—— 佚名</div></div>
  <div class="nav"><div class="row">
    <div class="it sel"><div class="i">◉</div><div>总览</div></div>
    <div class="it"><div class="i">◈</div><div>目标</div></div>
    <div class="it"><div class="i">✎</div><div>记录</div></div>
    <div class="it"><div class="i">◇</div><div>顾问</div></div>
    <div class="it"><div class="i">◔</div><div>复盘</div></div>
  </div></div>
</div></body></html>
